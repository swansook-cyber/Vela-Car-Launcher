name: Android Debug Build
on:
  push:
    branches: [develop/v0.1-automotive-dashboard]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          echo "Available SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug prototype
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vela-car-v0.1-debug-internal-only
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
